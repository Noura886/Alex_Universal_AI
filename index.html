<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alex — Universal AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c6cff'/%3E%3Cstop offset='1' stop-color='%232dd4bf'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M16 2 29 9v14L16 30 3 23V9z'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%230b0c12'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0c12;
  --panel:#111219;
  --panel-2:#171926;
  --panel-3:#1c1f2e;
  --line:#242737;
  --line-soft:#1b1e2a;
  --text:#eef0f7;
  --muted:#9297ab;
  --faint:#5c6178;
  --violet:#7c6cff;
  --violet-dim:#7c6cff33;
  --teal:#2dd4bf;
  --teal-dim:#2dd4bf33;
  --c-openai:#34d399;
  --c-gemini:#5b93ff;
  --c-claude:#c084fc;
  --c-image:#f472b6;
  --radius-lg:18px;
  --radius-md:12px;
  --radius-sm:8px;
  --shadow:0 10px 30px -12px rgba(0,0,0,.55);
  --font-display:'Sora',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--font-body);
  background:
    radial-gradient(1100px 480px at 14% -8%, #1b1436 0%, transparent 60%),
    radial-gradient(900px 460px at 100% 0%, #06231f 0%, transparent 55%),
    var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
button,textarea,select,input{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:var(--violet-dim)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2a2d3d;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#383c52}

.app{height:100%;display:flex}

/* ---------- Sidebar ---------- */
.sidebar{width:272px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 20px}
.brand svg{width:26px;height:26px;flex:none}
.brand .name{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.01em}
.brand .tag{font-size:11px;color:var(--faint);margin-top:1px}
.new{width:100%;border:1px solid var(--line);background:linear-gradient(135deg,var(--violet),#5a4de0);color:#fff;border-radius:var(--radius-md);padding:11px 14px;font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 18px -8px #7c6cff66;transition:transform .15s ease, box-shadow .15s ease}
.new:hover{transform:translateY(-1px);box-shadow:0 10px 22px -8px #7c6cff88}
.new:active{transform:translateY(0)}
.searchwrap{position:relative;margin-top:12px}
.searchwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--faint)}
[dir=rtl] .searchwrap svg{left:auto;right:11px}
.search{width:100%;background:var(--panel-2);border:1px solid var(--line-soft);color:var(--text);border-radius:var(--radius-sm);padding:9px 12px 9px 32px;outline:none;font-size:13px;transition:border-color .15s ease}
[dir=rtl] .search{padding:9px 32px 9px 12px}
.search:focus{border-color:#3c4160}
.label{font-size:11.5px;color:var(--faint);margin:18px 8px 6px;font-weight:500}
.chats{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:2px;margin:0 -4px}
.chatitem{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:var(--radius-sm);color:#c7cbdb;cursor:pointer;font-size:13.5px}
.chatitem .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatitem .del{flex:none;opacity:0;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:transparent;color:var(--faint)}
.chatitem .del:hover{background:#3a1f24;color:#f27272}
.chatitem:hover{background:var(--panel-3)}
.chatitem:hover .del{opacity:1}
.chatitem.active{background:var(--panel-3);color:#fff;box-shadow:inset 2px 0 0 var(--violet)}
.empty-hist{color:var(--faint);font-size:12.5px;padding:10px}
.bottom{border-top:1px solid var(--line);padding-top:12px;margin-top:10px}
.select{width:100%;background:var(--panel-2);border:1px solid var(--line-soft);color:var(--text);border-radius:var(--radius-sm);padding:8px 10px;outline:none;font-size:13px}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:60px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:10px;background:linear-gradient(180deg,#0e0f16,transparent)}
.top .title{font-family:var(--font-display);font-weight:700;font-size:15px}
.top .sub{color:var(--faint);font-size:12px}
.status{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
[dir=rtl] .status{margin-left:0;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px var(--teal-dim)}
.dot.off{background:#797f95;box-shadow:none}

.banner{margin:14px 22px 0;padding:11px 14px;border:1px solid #3a3320;background:#241f11;border-radius:var(--radius-sm);font-size:12.5px;color:#e3c777;display:flex;gap:9px;align-items:flex-start}
.banner code{background:#00000033;padding:1px 5px;border-radius:5px;font-family:var(--font-mono);font-size:11.5px}

.messages{flex:1;overflow-y:auto;padding:26px 20px 6px}
.wrap{width:min(860px,100%);margin:0 auto}

.welcome{text-align:center;padding-top:9vh}
.welcome .mark{width:52px;height:52px;margin:0 auto 18px}
.welcome h1{font-family:var(--font-display);font-size:34px;font-weight:700;margin:0 0 10px;letter-spacing:-.01em}
.welcome p{color:var(--muted);margin:0 0 30px;font-size:14.5px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:620px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md);padding:15px;text-align:left;transition:border-color .15s ease, transform .15s ease}
[dir=rtl] .card{text-align:right}
.card:hover{border-color:#3c4160;transform:translateY(-2px)}
.card .ico{font-size:18px;margin-bottom:8px;display:block}
.card b{display:block;margin-bottom:3px;font-size:13.5px;font-weight:600}
.card small{color:var(--faint);font-size:12px;line-height:1.4;display:block}

.message{display:flex;gap:12px;margin:0 0 26px;align-items:flex-start}
.avatar{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:13px;font-weight:700;background:var(--panel-3);border:1px solid var(--line)}
.message.user .avatar{background:linear-gradient(135deg,#fff,#d9dbe6);color:#111}
.message.assistant .avatar{background:linear-gradient(135deg,var(--violet),var(--teal));color:#0b0c12}
.content{max-width:780px;line-height:1.68;min-width:0;font-size:14.5px}
.message.user .content{background:var(--panel-3);border:1px solid var(--line-soft);border-radius:16px 16px 4px 16px;padding:11px 15px;white-space:pre-wrap}
[dir=rtl] .message.user .content{border-radius:16px 16px 16px 4px}
.content p{margin:0 0 12px}
.content p:last-child{margin-bottom:0}
.content ul,.content ol{margin:0 0 12px;padding-left:22px}
[dir=rtl] .content ul,[dir=rtl] .content ol{padding-left:0;padding-right:22px}
.content li{margin:4px 0}
.content h3,.content h4,.content h5{font-family:var(--font-display);margin:16px 0 8px;font-weight:700}
.content a{color:var(--teal);text-decoration:none;border-bottom:1px solid #2dd4bf55}
.content a:hover{border-color:var(--teal)}
.inline{background:#1f2231;border:1px solid var(--line-soft);border-radius:5px;padding:1px 6px;font-family:var(--font-mono);font-size:12.8px;color:#d9c2ff}
.codeblock{background:#0a0b10;border:1px solid var(--line-soft);border-radius:var(--radius-md);margin:4px 0 14px;overflow:hidden}
.codehead{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:#0f1018;border-bottom:1px solid var(--line-soft)}
.codelang{font-family:var(--font-mono);font-size:11px;color:var(--faint);text-transform:lowercase}
.copybtn{background:transparent;border:1px solid var(--line-soft);color:var(--muted);border-radius:6px;padding:3px 9px;font-size:11px}
.copybtn:hover{color:var(--text);border-color:#3c4160}
.codeblock pre{margin:0;padding:13px 14px;overflow-x:auto}
.codeblock code{font-family:var(--font-mono);font-size:12.8px;line-height:1.6;color:#dfe3f0}

.meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--faint);margin-top:8px}
.meta .pdot{width:6px;height:6px;border-radius:50%}
.genimg{max-width:min(560px,100%);border-radius:14px;margin-top:10px;border:1px solid var(--line);display:block}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bounce 1.1s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}

.composer{border-top:1px solid var(--line);padding:14px 20px 16px;background:linear-gradient(0deg,#0d0e14,transparent)}
.composerbox{width:min(860px,100%);margin:0 auto;background:var(--panel-2);border:1px solid var(--line);border-radius:18px;padding:9px 9px 9px 14px;transition:border-color .15s ease}
[dir=rtl] .composerbox{padding:9px 14px 9px 9px}
.composerbox:focus-within{border-color:#4b4f8f}
.row{display:flex;gap:8px;align-items:flex-end}
.textinput{flex:1;resize:none;background:transparent;border:0;outline:0;padding:9px 0;min-height:24px;max-height:180px;font-size:14.5px;line-height:1.5}
.textinput::placeholder{color:var(--faint)}
.send{width:38px;height:38px;flex:none;border:0;border-radius:12px;background:linear-gradient(135deg,var(--violet),var(--teal));color:#0b0c12;font-size:16px;display:grid;place-items:center;transition:opacity .15s ease, transform .1s ease}
.send:disabled{opacity:.35;cursor:default}
.send:not(:disabled):active{transform:scale(.94)}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:9px}
.tool{background:transparent;border:1px solid var(--line-soft);color:var(--muted);border-radius:9px;padding:6px 10px;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.tool:hover{color:var(--text);border-color:#3c4160}
.providersel{margin-left:auto}
[dir=rtl] .providersel{margin-left:0;margin-right:auto}
.providersel select{background:var(--panel-3);border:1px solid var(--line-soft);color:var(--text);border-radius:9px;padding:6px 10px;font-size:12px;outline:none}
.hint{text-align:center;color:var(--faint);font-size:11px;margin-top:9px}

@media(max-width:820px){
  .sidebar{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--shadow)}
  [dir=rtl] .sidebar{inset:0 0 0 auto;transform:translateX(100%)}
  .sidebar.open{transform:translateX(0)}
  .menubtn{display:grid!important}
  .welcome{padding-top:6vh}
  .welcome h1{font-size:26px}
  .cards{grid-template-columns:1fr}
  .messages{padding:18px 14px 6px}
  .composer{padding:10px 12px 12px}
  .content{max-width:100%}
}
.menubtn{display:none;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);place-items:center;flex:none}
.overlay{display:none;position:fixed;inset:0;background:#000a;z-index:15}
.overlay.show{display:block}
</style>
</head>
<body>
<div class="app">
  <div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg viewBox="0 0 32 32"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c6cff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs><path fill="url(#lg)" d="M16 2 29 9v14L16 30 3 23V9z"/><circle cx="16" cy="16" r="5" fill="#0b0c12"/></svg>
      <div><div class="name">Alex</div><div class="tag">Universal AI</div></div>
    </div>
    <button class="new" onclick="newChat()" id="newBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span id="newBtnText">New chat</span>
    </button>
    <div class="searchwrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input class="search" id="search" placeholder="Search chats..." oninput="renderChats()">
    </div>
    <div class="label" id="historyLabel">Chat history</div>
    <div class="chats" id="chats"></div>
    <div class="bottom">
      <div class="label" id="langLabel" style="margin-top:0">Language</div>
      <select class="select" id="lang" onchange="setLang(this.value)">
        <option value="en">🌍 English</option>
        <option value="ar">🌍 العربية</option>
        <option value="es">🌍 Español</option>
        <option value="fr">🌍 Français</option>
        <option value="de">🌍 Deutsch</option>
      </select>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="menubtn" onclick="toggleSidebar(true)" aria-label="Menu">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div>
        <div class="title">Alex</div>
        <div class="sub" id="topSub">Universal AI Agent</div>
      </div>
      <div class="status" id="statusWrap"><span class="dot" id="statusDot"></span><span id="statusText">Online</span></div>
    </header>

    <div class="banner" id="banner" style="display:none">
      <span>⚠️</span>
      <span id="bannerText"></span>
    </div>

    <section class="messages" id="messages"><div class="wrap" id="wrap"></div></section>

    <footer class="composer">
      <div class="composerbox">
        <div class="row">
          <textarea class="textinput" id="input" rows="1" placeholder="Message Alex..." onkeydown="handleKey(event)" oninput="autoGrow(this)"></textarea>
          <button class="send" onclick="send()" id="sendBtn" aria-label="Send">↑</button>
        </div>
        <div class="tools">
          <button class="tool" onclick="promptFor('code')">💻 <span id="t-code">Code</span></button>
          <button class="tool" onclick="promptFor('image')">🎨 <span id="t-image">Image</span></button>
          <button class="tool" onclick="promptFor('explain')">🧠 <span id="t-explain">Explain</span></button>
          <button class="tool" onclick="promptFor('search')">🔎 <span id="t-search">Research</span></button>
          <div class="providersel">
            <select id="provider">
              <option value="auto">🧠 Auto model</option>
              <option value="auto">🆓 OpenRouter Free</option>
            </select>
          </div>
        </div>
      </div>
      <div class="hint" id="hintText">Alex can chat, code, research, create images, and remember your conversations.</div>
    </footer>
  </main>
</div>

const PROVIDER_META = {
  'OpenRouter Free':{icon:'🆓', color:'var(--c-gemini)'},
};

function escape(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function md(raw){
  let s = escape(raw);
  const blocks = [];
  s = s.replace(/```([\w+-]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const id = blocks.length;
    const label = (lang || 'text').trim();
    blocks.push(
      `<div class="codeblock"><div class="codehead"><span class="codelang">${escape(label)}</span>` +
      `<button class="copybtn" onclick="copyCode(this)">${T[S.lang].copy}</button></div><pre><code>${code.replace(/\n$/,'')}</code></pre></div>`
    );
    return `@@BLOCK${id}@@`;
  });
  s = s.replace(/`([^`\n]+)`/g, '<code class="inline">$1</code>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');

  const lines = s.split('\n');
  const out = [];
  let para = [];
  let list = null;
  function flushPara(){ if(para.length){ out.push('<p>'+para.join('<br>')+'</p>'); para=[]; } }
  function flushList(){ if(list){ const tag=list.type; out.push(`<${tag}>`+list.items.map(i=>`<li>${i}</li>`).join('')+`</${tag}>`); list=null; } }
  for(const line of lines){
    if(/^@@BLOCK\d+@@$/.test(line.trim())){ flushPara(); flushList(); out.push(line.trim()); continue; }
    if(/^\s*$/.test(line)){ flushPara(); flushList(); continue; }
    let m;
    if(m = line.match(/^#### (.*)$/)){ flushPara(); flushList(); out.push(`<h5>${m[1]}</h5>`); continue; }
    if(m = line.match(/^### (.*)$/)){ flushPara(); flushList(); out.push(`<h4>${m[1]}</h4>`); continue; }
    if(m = line.match(/^## (.*)$/)){ flushPara(); flushList(); out.push(`<h3>${m[1]}</h3>`); continue; }
    if(m = line.match(/^\s*[-*]\s+(.*)$/)){ flushPara(); if(!list||list.type!=='ul'){flushList(); list={type:'ul',items:[]};} list.items.push(m[1]); continue; }
    if(m = line.match(/^\s*\d+\.\s+(.*)$/)){ flushPara(); if(!list||list.type!=='ol'){flushList(); list={type:'ol',items:[]};} list.items.push(m[1]); continue; }
    flushList();
    para.push(line);
  }
  flushPara(); flushList();
  s = out.join('');
  blocks.forEach((b,i) => s = s.replace(`@@BLOCK${i}@@`, b));
  return s;
}

function copyCode(btn){
  const code = btn.closest('.codeblock').querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(() => {
    const old = btn.textContent;
    btn.textContent = T[S.lang].copied;
    setTimeout(() => btn.textContent = old, 1400);
  });
}

function welcome(){
  const t = T[S.lang];
  return `<div class="welcome">
    <svg class="mark" viewBox="0 0 32 32"><defs><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c6cff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs><path fill="url(#lg2)" d="M16 2 29 9v14L16 30 3 23V9z"/><circle cx="16" cy="16" r="5" fill="#0b0c12"/></svg>
    <h1>${t.hello}</h1><p>${t.sub}</p>
    <div class="cards">
      <div class="card" onclick="promptFor('code')"><span class="ico">💻</span><b>${t.code}</b><small>${t.cCode}</small></div>
      <div class="card" onclick="promptFor('image')"><span class="ico">🎨</span><b>${t.image}</b><small>${t.cImage}</small></div>
      <div class="card" onclick="promptFor('explain')"><span class="ico">🧠</span><b>${t.explain}</b><small>${t.cExplain}</small></div>
      <div class="card" onclick="promptFor('search')"><span class="ico">🔎</span><b>${t.searchBtn}</b><small>${t.cSearch}</small></div>
    </div>
  </div>`;
}

function messageHTML(m){
  const t = T[S.lang];
  const isUser = m.role === 'user';
  const meta = PROVIDER_META[m.provider];
  let metaHTML = '';
  if(m.provider){
    metaHTML = `<div class="meta">${meta ? `<span class="pdot" style="background:${meta.color}"></span>${meta.icon} ` : ''}${escape(m.provider)}${m.model ? ' · ' + escape(m.model) : ''}</div>`;
  }
  const body = m.pending
    ? `<div class="typing"><span></span><span></span><span></span></div>`
    : (isUser ? escape(m.content) : md(m.content || ''));
  const img = m.image ? `<img class="genimg" src="${m.image}" alt="Generated image">` : '';
  const avatar = isUser ? 'U' : '✦';
  return `<div class="message ${isUser ? 'user' : 'assistant'}">
    <div class="avatar">${avatar}</div>
    <div class="content">${body}${img}${metaHTML}</div>
  </div>`;
}

function render(){
  $('wrap').innerHTML = S.messages.length ? S.messages.map(messageHTML).join('') : welcome();
  $('messages').scrollTop = $('messages').scrollHeight;
}

async function checkHealth(){
  try{
    const r = await fetch('/api/health');
    const d = await r.json();
    S.providers = d.providers || {};
    const any = Object.values(S.providers).some(Boolean);
    $('statusDot').classList.toggle('off', !any);
    $('statusText').textContent = any ? T[S.lang].online : T[S.lang].offline;
    $('banner').style.display = any ? 'none' : 'flex';
    $('bannerText').textContent = T[S.lang].noProvider;
  }catch{
    $('statusDot').classList.add('off');
    $('statusText').textContent = T[S.lang].offline;
  }
}

async function loadConversations(){
  try{
    const r = await fetch('/api/conversations');
    S.conversations = await r.json();
  }catch{ S.conversations = []; }
  renderChats();
}

function renderChats(){
  const q = ($('search').value || '').toLowerCase();
  const list = (S.conversations || []).filter(c => (c.title || '').toLowerCase().includes(q));
  $('chats').innerHTML = list.length ? list.map(c => `
    <div class="chatitem ${c.id == S.conversationId ? 'active' : ''}" onclick="loadConversation(${c.id})">
      <span class="t">${escape(c.title || '')}</span>
      <button class="del" onclick="event.stopPropagation();deleteConversation(${c.id})" aria-label="Delete">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m-9 0 1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/></svg>
      </button>
    </div>`).join('') : `<div class="empty-hist">${T[S.lang].noHist}</div>`;
}

async function loadConversation(id){
  const r = await fetch('/api/conversations/' + id + '/messages');
  const ms = await r.json();
  S.conversationId = id;
  S.messages = ms.map(m => ({ role:m.role, content:m.content, provider:m.provider }));
  render();
  renderChats();
  toggleSidebar(false);
}

async function deleteConversation(id){
  if(!confirm(T[S.lang].delConfirm)) return;
  await fetch('/api/conversations/' + id, { method:'DELETE' });
  if(S.conversationId == id){ S.conversationId = null; S.messages = []; render(); }
  loadConversations();
}

function newChat(){
  S.conversationId = null;
  S.messages = [];
  render();
  renderChats();
  toggleSidebar(false);
  $('input').focus();
}

function promptFor(type){
  const map = { code:'Write or debug this code: ', image:'Create an image of ', explain:'Explain ', search:'Research the latest information about ' };
  const mapAr = { code:'اكتب أو صحّح هذا الكود: ', image:'أنشئ صورة لـ ', explain:'اشرح لي ', search:'ابحث عن آخر المعلومات حول ' };
  $('input').value = S.lang === 'ar' ? mapAr[type] : map[type];
  autoGrow($('input'));
  $('input').focus();
}

function handleKey(e){
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
}

function autoGrow(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 180) + 'px';
}

function toggleSidebar(open){
  $('sidebar').classList.toggle('open', open);
  $('overlay').classList.toggle('show', open);
}

async function send(){
  const input = $('input');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  autoGrow(input);
  $('sendBtn').disabled = true;

  S.messages.push({ role:'user', content:text });
  S.messages.push({ role:'assistant', content:'', pending:true });
  render();

  try{
    const r = await fetch('/api/agent', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ message:text, conversationId:S.conversationId, provider:$('provider').value })
    });
    const d = await r.json();
    S.messages.pop();
    if(!r.ok) throw new Error(d.error || 'Request failed');
    S.conversationId = d.conversationId;
    S.messages.push({ role:'assistant', content:d.text || d.reply || '', provider:d.provider, model:d.model, image:d.image });
    render();
    loadConversations();
  }catch(e){
    S.messages.pop();
    S.messages.push({ role:'assistant', content:'⚠️ ' + e.message });
    render();
  }finally{
    $('sendBtn').disabled = false;
  }
}

function setLang(lang){
  S.lang = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  const t = T[lang];
  $('newBtnText').textContent = t.new;
  $('historyLabel').textContent = t.hist;
  $('langLabel').textContent = t.lang;
  $('search').placeholder = t.search;
  $('input').placeholder = t.ph;
  $('t-code').textContent = t.code;
  $('t-image').textContent = t.image;
  $('t-explain').textContent = t.explain;
  $('t-search').textContent = t.searchBtn;
  $('hintText').textContent = t.hint;
  $('lang').value = lang;
  const any = S.providers && Object.values(S.providers).some(Boolean);
  $('statusText').textContent = any === false ? t.offline : t.online;
  if(S.providers && !any) $('bannerText').textContent = t.noProvider;
  renderChats();
  render();
}

setLang('en');
checkHealth();
loadConversations();
</script>
</body>
</html>
